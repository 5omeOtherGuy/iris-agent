name: Dependency Review

on:
  pull_request:
    branches: [main]

concurrency:
  # A new push to a PR cancels its superseded run; other runs get their own
  # group, so pushes to main are never cancelled or dropped from the queue.
  group: dependency-review-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Review dependency changes
    # Private repositories need dependency review support enabled before this
    # action can inspect dependency diffs. Keep the workflow ready, but avoid a
    # failing required check when the feature is unavailable.
    if: ${{ github.event.repository.private == false || vars.ENABLE_GHAS_SCANS == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency diff
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
