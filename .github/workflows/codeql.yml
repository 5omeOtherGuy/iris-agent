# CodeQL: GitHub's static analysis. Scans the Rust source for known
# vulnerability and quality issues. Findings appear under the repo's
# "Security" tab -> "Code scanning". CodeQL Rust support is generally
# available (since October 2025).
# Docs: https://docs.github.com/en/code-security/code-scanning

name: CodeQL

# Not a PR gate: scans run on pushes to main and weekly, keeping PR merges
# fast while every landed commit is still analyzed.
on:
  push:
    branches: [main]
  schedule:
    # Weekly Monday scan in addition to per-push scans of main.
    - cron: "24 5 * * 1"
  workflow_dispatch:

# One group per run: every landed commit on main is scanned, never cancelled.
concurrency:
  group: codeql-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Private repositories need GitHub Advanced Security/code scanning enabled
    # before CodeQL can upload SARIF. Keep the workflow ready, but avoid a
    # failing required check when the feature is unavailable.
    if: ${{ github.event.repository.private == false || vars.ENABLE_GHAS_SCANS == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Required for CodeQL to upload SARIF results to the Security tab.
      security-events: write
      # Required for the CodeQL action to read the workflow's own status.
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [rust]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          # "security-and-quality" is broader than the default; trades a few
          # more false positives for catching more real issues.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
