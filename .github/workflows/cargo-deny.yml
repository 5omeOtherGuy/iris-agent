# cargo-deny: supply-chain linting for Rust dependencies.
# Checks the dependency tree against RUSTSEC security advisories, banned/
# duplicate crates, and disallowed sources. License enforcement is configured
# in deny.toml but intentionally not run here until the allow-list is reviewed
# (see deny.toml). Docs: https://embarkstudios.github.io/cargo-deny/
name: cargo-deny

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Monday scan catches newly published advisories against pinned deps.
    - cron: "31 5 * * 1"
  workflow_dispatch:

concurrency:
  # A new push to a PR cancels its superseded run; other runs get their own
  # group, so pushes to main are never cancelled or dropped from the queue.
  group: cargo-deny-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans sources
